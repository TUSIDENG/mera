# Casdoor 本地部署配置（仅用于 docker-compose 本地环境）
# Casdoor 版本配置格式参考官方仓库 conf/app.conf
appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true
enableErrorLog = true

# 独立 PostgreSQL（casdoor-postgres 服务）
driverName = postgres
dbName = casdoor
dbUser = casdoor
dbPassword = casdoor_local_pass
dbHost = casdoor-postgres
dbPort = 5432
dbSSLMode = disable
dbDebug = false

isUsernameLowered = true
sessionConfig = {"enableSetCookie":true,"cookieLifetime":3600,"cookieName":"casdoor_session","cookieSameSite":"Lax"}
