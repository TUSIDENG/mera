# Casdoor 本地部署配置（仅用于 docker-compose 本地环境）
# Casdoor 版本配置格式参考官方仓库 conf/app.conf
appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true
enableErrorLog = true

# 独立 PostgreSQL（casdoor-postgres 服务）
# 注意：Casdoor 仅识别 dataSourceName（dbHost/dbUser 等拆分键会被忽略）
driverName = postgres
dataSourceName = user=casdoor password=casdoor_local_pass host=casdoor-postgres port=5432 dbname=casdoor sslmode=disable
dbName = casdoor
dbDebug = false

isUsernameLowered = true
