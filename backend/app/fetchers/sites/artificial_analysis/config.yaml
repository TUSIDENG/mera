# Artificial Analysis 榜单：页面 RSC 结构化解析为主，Playwright DOM 表格解析兜底
# 页面服务端渲染、数据内嵌公开 HTML，无需密钥；两条链路独立解析同源公开数据
key: artificial_analysis
label: Artificial Analysis
domain: general
data_type: model_metrics
data_types: [model_metrics]
description: 独立评测机构榜单，公开榜单页内嵌结构化数据，提供 Intelligence Index 等综合与专项指数，主榜分优先级最高。
homepage: https://artificialanalysis.ai/leaderboards/models
auth_required: false
strategies: [reverse_api, playwright]
rate_limit_per_min: 10
compliance:
  public_only: true
  notes: 仅访问公开榜单数据；站点明确限制自动化时停用改人工/授权数据
reverse_api:
  # 公开榜单页 HTML，解析 self.__next_f.push 内嵌的 initialModels 数组
  url: https://artificialanalysis.ai/leaderboards/models
  array_key: initialModels
  fields:
    model: name
    provider: modelCreatorName
    score: intelligenceIndex
playwright:
  url: https://artificialanalysis.ai/leaderboards/models
  # 实测页面仅一张 table（无 .leaderboard 类）；列序：1=模型 2=上下文 3=厂商 4=Intelligence 分
  rows_selector: "table tbody tr"
  next_selector: "button.next-page"
  fields:
    model: "td:nth-child(1)"
    score: "td:nth-child(4)"
    provider: "td:nth-child(3)"
  fingerprint_browser:
    enabled: false # 强风控时开启；camoufox 进程内，adspower/bitbrowser 经 Local API + CDP
    provider: camoufox
    local_api: http://host.docker.internal:50325
    profile_id: mera_aa_01
    startup_wait_sec: 30
normalize:
  fields:
    model_id: model
    provider: provider
    score: score
