# Aider LLM 代码编辑榜单：公开页面 HTML，Playwright 解析表格（无需登录）
key: aider_leaderboard
label: Aider Leaderboard
domain: coding
data_type: model_metrics
description: Aider 代码编辑基准榜，用多语言真实代码修改任务衡量模型的编辑通过率与成本，可作为编程能力的补充信号。
homepage: https://aider.chat/docs/leaderboards/
auth_required: false
strategies: [playwright]
rate_limit_per_min: 5
compliance:
  public_only: true
  notes: 仅解析公开榜单页表格，低频访问，遵守站点条款
playwright:
  url: https://aider.chat/docs/leaderboards/
  rows_selector: "table tbody tr"
  next_selector: null # 单页榜单，无翻页
  # 表格列：1 展开箭头 / 2 模型 / 3 正确率 / 4 成本 / 5 命令 / 6 编辑格式正确率 / 7 编辑格式
  fields:
    model: "td:nth-child(2)"
    score: "td:nth-child(3)"
    cost: "td:nth-child(4)"
normalize:
  fields:
    model_id: model
    score: score
    # 厂商由 playwright.collect_rows 按模型名推断后注入（榜单本身无厂商列）
    provider: provider
