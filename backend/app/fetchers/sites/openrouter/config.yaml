# OpenRouter 模型目录：官方 Models API（公开 JSON，无需登录）
# 可选 OPENROUTER_API_KEY 仅用于官方授权读取、提高限额；缺失不影响方案可用性
# 数据域：榜单（多维评分，来自 OpenRouter 附带的 benchmarks）+ 按量价格（pricing 块）
key: openrouter
label: OpenRouter
domain: general
data_type: model_metrics
data_types: [model_metrics, api_price]
auth_required: false
strategies: [api]
rate_limit_per_min: 30
compliance:
  public_only: true
  notes: 仅采集公开模型目录与公开价格，遵守 OpenRouter 服务条款与限频
api:
  url: https://openrouter.ai/api/v1/models
  records_path: data
  api_key_ref: env:OPENROUTER_API_KEY # 可选
normalize:
  defaults:
    provider: openrouter
    currency: USD
    unit: token # OpenRouter pricing.* 为每 token 美元价
  # 多维评分（OpenRouter 响应 benchmarks.artificial_analysis 子对象，覆盖不完整）；
  # 主榜分按 intelligence -> coding -> agentic 回落，全部缺失则 benchmark_score=NULL
  scores:
    intelligence: benchmarks.artificial_analysis.intelligence_index
    coding: benchmarks.artificial_analysis.coding_index
    agentic: benchmarks.artificial_analysis.agentic_index
  fields:
    model_id: id
    input_price: pricing.prompt
    output_price: pricing.completion
    context_length: context_length
    display_name: name
