[project]
name = "mera-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: 需要真实 Postgres/Redis 的集成测试（用 -m integration 单独运行）",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
